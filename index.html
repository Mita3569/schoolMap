<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>School Map</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout">

        <!-- マップ表示エリア -->
        <main class="map-area">
            <div class="map-container">
                <img src="images/map.jpg" alt="マップ">

                <!-- マーカー -->
                <button class="marker"
                        style="left: 50%; top: 50%;"
                        onclick="showInfo('地点①')">
                    ①
                </button>
            </div>
        </main>

        <!-- 操作説明欄 -->
        <aside class="sidebar">
            <h2>操作説明</h2>
            <p>マップの操作方法を表示します。</p>
        </aside>

    </div>

    <script>
        function showInfo(name) {
            alert(name);
        }
    </script>

</body>
</html>
