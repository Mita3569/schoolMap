<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>構内マップ</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <!-- 地図表示エリア -->
  <main id="map-container">
    <div id="map-content">

      <!-- 地図画像 -->
      <img
        id="map-image"
        src="./images/map.jpg"
        alt="構内マップ"
        draggable="false"
      >

      <!-- 地図上のマーカー：位置は必要に応じて変更 -->
      <button
        class="marker"
        style="left: 50%; top: 50%;"
        onclick="showInfo('中央地点')"
        aria-label="中央地点の説明"
      >中央</button>

      <button
        class="marker"
        style="left: 65%; top: 40%;"
        onclick="showInfo('入口')"
        aria-label="入口の説明"
      >入口</button>

      <!-- 現在地マーカー（座標変換実装後に表示） -->
      <div id="current-location-marker"
           aria-label="現在地"
           hidden></div>

    </div>
  </main>

  <!-- 現在地の座標表示 -->
  <section id="location-display"
           aria-live="polite">
    <strong>現在の位置情報</strong>
    <p id="location-lat">緯度：取得待ち</p>
    <p id="location-lon">経度：取得待ち</p>
    <p id="location-accuracy">精度：取得待ち</p>
    <p id="location-time">更新時刻：未取得</p>
    <p id="location-status">状態：待機中</p>
    <p id="location-mapx">マップX座標：未計算</p>
    <p id="location-mapy">マップY座標：未計算</p>
    <p id="location-px">マップXピクセル：未計算</p>
    <p id="location-py">マップYピクセル：未計算</p>
  </section>

  <!-- 地図の操作ボタン -->
  <nav id="zoom-controls" aria-label="地図操作">
    <button type="button"
            onclick="zoomIn()"
            aria-label="拡大">＋</button>

    <button type="button"
            onclick="zoomOut()"
            aria-label="縮小">－</button>

    <button type="button"
            onclick="resetZoom()">初期位置</button>
  </nav>

  <!-- マーカーの説明 -->
  <section id="info" hidden aria-live="polite">
    <span id="info-text"></span>
    <button type="button"
            onclick="hideInfo()"
            aria-label="説明を閉じる">閉じる</button>
  </section>

  <!-- 位置情報の操作 -->
  <nav id="location-controls" aria-label="位置情報操作">
    <button type="button"
            onclick="startLocationTracking()">
      位置情報を開始
    </button>
    <button type="button"
            onclick="stopLocationTracking()">
      位置情報を停止
    </button>
  </nav>

  <script src="./script.js"></script>
</body>
</html>
