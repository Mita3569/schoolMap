<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>米子工業高等専門学校-構内マップ-</title>
  <link rel="icon" href="./images/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <!-- 地図表示エリア -->
  <main id="map-container">
    <div id="map-content">

      <!-- 地図画像 -->
      <img
        id="map-image"
        src="./images/map/floor1.JPG"
        alt="構内マップ"
        draggable="false"
      >

      <!-- 現在地マーカー -->
      <div id="current-location-marker"
           aria-label="現在地"
           hidden></div>

    </div>
  </main>

  <!-- 現在地の座標表示 -->
  <section id="location-display"
           aria-live="polite">
    <strong>現在の位置情報</strong>
    <p id="location-lat">緯度：取得待ち</p>
    <p id="location-lon">経度：取得待ち</p>
    <p id="location-accuracy">精度：取得待ち</p>
    <p id="location-time">更新時刻：未取得</p>
    <p id="location-status">状態：待機中</p>
  </section>

  <!-- 地図の操作ボタン -->
  <nav id="map-controls" aria-label="地図操作"></nav>
    <button type="button"
            onclick="upFloor()"
            aria-label="上の階">≫</button>
    <button type="button"
            onclick="downFloor()"
            aria-label="下の階">≪</button>

    <button type="button"
            onclick="zoomIn()"
            aria-label="拡大">＋</button>
    <button type="button"
            onclick="zoomOut()"
            aria-label="縮小">－</button>

    <button type="button"
            onclick="resetZoom()">初期位置</button>
  </nav>

  <!-- マーカーの説明 -->
  <section id="info" hidden aria-live="polite">
    <span id="info-text"></span>
    <button type="button"
            onclick="hideInfo()"
            aria-label="説明を閉じる">閉じる</button>
  </section>

  <!-- 位置情報の操作 -->
  <nav id="location-controls" aria-label="位置情報操作">
    <button type="button"
            onclick="startLocationTracking()">
      位置情報を開始
    </button>
    <button type="button"
            onclick="stopLocationTracking()">
      位置情報を停止
    </button>
  </nav>

  <script src="./script.js"></script>
</body>
</html>
