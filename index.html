<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>School Map</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout">

        <!-- マップ表示エリア -->
        <main class="map-area">
            <div class="map-container"><div class="map-container" id="mapContainer">

            <!-- 地図とマーカーをまとめる -->
            <div class="map-content" id="mapContent">

                <img src="./images/map.jpg" alt="マップ">

                <!-- マーカー -->
                <button class="marker"
                        style="left: 40%; top: 30%;"
                        onclick="showInfo('図書館')">
                    ①
                </button>

                <button class="marker"
                        style="left: 65%; top: 60%;"
                        onclick="showInfo('体育館')">
                    ②
                </button>

            </div>

            <!-- 拡大・縮小ボタン -->
            <div class="zoom-controls">
                <button onclick="zoomIn()" aria-label="拡大">＋</button>
                <button onclick="zoomOut()" aria-label="縮小">－</button>
                <button onclick="resetZoom()" aria-label="元のサイズに戻す">⟳</button>
            </div>

        </div>
            </div>
        </main>

        <!-- 操作説明欄 -->
        <aside class="sidebar">
            <h2>操作説明</h2>
            <p>マップの操作方法を表示します。</p>
        </aside>

    </div>

    <script>
        function showInfo(name) {
            alert(name);
        }
    </script>

</body>
</html>
