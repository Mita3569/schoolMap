<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>School Map</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout">
        <!-- 現在地の座標表示 -->
        <div id="location-display">
        <strong>現在の位置情報</strong>
        <p>緯度：取得待ち</p>
        <p>経度：取得待ち</p>
        <p>精度：取得待ち</p>
        <p>状態：位置情報を取得中...</p>
        </div>

        <meta name="viewport"
            content="width=device-width, initial-scale=1.0">

        <div class="map-container" id="mapContainer">

            <div class="map-content" id="mapContent">
                <img src="./images/map.jpg"
                    alt="マップ"
                    draggable="false">

                <button class="marker"
                        style="left: 40%; top: 30%;"
                        onclick="showInfo('図書館')">
                    ①
                </button>

                <button class="marker"
                        style="left: 65%; top: 60%;"
                        onclick="showInfo('体育館')">
                    ②
                </button>
            </div>

            <div class="zoom-controls">
                <button type="button" onclick="zoomIn()">＋</button>
                <button type="button" onclick="zoomOut()">－</button>
                <button type="button" onclick="resetZoom()">⟳</button>
            </div>

            <div id="info" class="map-info" hidden></div>

        </div>
        </main>
    </div>
<script>

// ========================================
// 1. 初期設定
// ========================================

// 地図の要素
const mapContainer = document.getElementById("map-container");
const mapContent = document.getElementById("map-content");

// 地図の操作状態
let zoom = 1.5;
const minZoom = 1;
const maxZoom = 5;

let x = 0;
let y = 0;

// ドラッグ操作の状態
let isDragging = false;
let lastX = 0;
let lastY = 0;

// タッチ操作用
const pointers = new Map();
let lastPinchDistance = 0;

// 現在地の監視ID
let watchId = null;


// ========================================
// 2. 地図の表示操作
// ========================================

// 地図の拡大・縮小を反映
function updateTransform() {
    mapContent.style.transform =
        `translate(${x}px, ${y}px) scale(${zoom})`;
}

// 地図が表示範囲から外れすぎないように制限
function clampPosition() {
    const rect = mapContainer.getBoundingClientRect();

    const minX = rect.width * (1 - zoom);
    const minY = rect.height * (1 - zoom);

    x = Math.min(0, Math.max(minX, x));
    y = Math.min(0, Math.max(minY, y));
}

// 拡大
function zoomIn() {
    changeZoom(0.2);
}

// 縮小
function zoomOut() {
    changeZoom(-0.2);
}

// ズーム倍率の変更
function changeZoom(amount) {
    const oldZoom = zoom;
    zoom = Math.max(minZoom, Math.min(maxZoom, zoom + amount));

    // 画面中央を基準に拡大・縮小
    const rect = mapContainer.getBoundingClientRect();
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;
    const ratio = zoom / oldZoom;

    x = centerX - (centerX - x) * ratio;
    y = centerY - (centerY - y) * ratio;

    clampPosition();
    updateTransform();
}

// 初期位置に戻す
function resetZoom() {
    zoom = 1.5;

    const rect = mapContainer.getBoundingClientRect();
    x = rect.width * (1 - zoom) / 2;
    y = rect.height * (1 - zoom) / 2;

    clampPosition();
    updateTransform();
}


// ========================================
// 3. 地図のドラッグ操作
// ========================================

// ドラッグ開始
function onPointerDown(event) {
    if (event.target.closest("button")) return;

    pointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
    });

    mapContainer.setPointerCapture(event.pointerId);

    if (pointers.size === 1) {
        isDragging = true;
        lastX = event.clientX;
        lastY = event.clientY;
    } else if (pointers.size === 2) {
        isDragging = false;
        lastPinchDistance = getPinchDistance();
    }
}

// 指と指の距離を計算
function getPinchDistance() {
    const points = [...pointers.values()];
    if (points.length < 2) return 0;

    const dx = points[0].x - points[1].x;
    const dy = points[0].y - points[1].y;

    return Math.hypot(dx, dy);
}

// ドラッグ・ピンチ中
function onPointerMove(event) {
    if (!pointers.has(event.pointerId)) return;

    pointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
    });

    // 2本指のピンチズーム
    if (pointers.size === 2) {
        const distance = getPinchDistance();

        if (lastPinchDistance > 0 && distance > 0) {
            const amount = (distance - lastPinchDistance) * 0.005;
            changeZoom(amount);
        }

        lastPinchDistance = distance;
        return;
    }

    // 1本指のドラッグ
    if (!isDragging) return;

    const dx = event.clientX - lastX;
    const dy = event.clientY - lastY;

    x += dx;
    y += dy;

    lastX = event.clientX;
    lastY = event.clientY;

    clampPosition();
    updateTransform();
}

// ドラッグ終了
function onPointerUp(event) {
    pointers.delete(event.pointerId);

    if (pointers.size === 1) {
        const point = [...pointers.values()][0];
        isDragging = true;
        lastX = point.x;
        lastY = point.y;
    } else {
        isDragging = false;
        lastPinchDistance = 0;
    }
}


// ========================================
// 4. マーカー・説明表示
// ========================================

// マーカーを押したときの説明表示
function showInfo(message) {
    const info = document.getElementById("info");
    if (info) {
        info.textContent = message;
        info.hidden = false;
    }
}

// 説明を閉じる
function hideInfo() {
    const info = document.getElementById("info");
    if (info) {
        info.hidden = true;
    }
}


// ========================================
// 5. 位置情報の取得
// ========================================

// 現在地の取得を開始
function startLocationTracking() {
    if (!("geolocation" in navigator)) {
        console.error("このブラウザは位置情報に対応していません。");
        return;
    }

    watchId = navigator.geolocation.watchPosition(
        onLocationSuccess,
        onLocationError,
        {
            enableHighAccuracy: true,
            maximumAge: 1000,
            timeout: 10000
        }
    );
}

// ========================================
// 位置情報を取得したときの処理
// ========================================

function onLocationSuccess(position) {
    const lat = position.coords.latitude;
    const lon = position.coords.longitude;
    const accuracy = position.coords.accuracy;

    // 現在地表示欄を更新
    const display = document.getElementById("location-display");

    display.innerHTML = `
        <strong>現在の位置情報</strong>
        <p>緯度：${lat.toFixed(6)}</p>
        <p>経度：${lon.toFixed(6)}</p>
        <p>精度：約${Math.round(accuracy)} m</p>
        <p>状態：取得中・更新済み</p>
    `;

    // 地図上の現在地マーカー処理は、
    // 地図の範囲内にいる場合だけ別途実行する
}

// 位置情報を取得できなかったとき
function onLocationError(error) {
    console.error("位置情報を取得できませんでした:", error.message);
}

// 位置情報の取得を停止
function stopLocationTracking() {
    if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
    }
}


// ========================================
// 6. 初期化・イベント登録
// ========================================

function initializeMap() {
    // 初期表示位置
    resetZoom();

    // マウス・タッチ操作
    mapContainer.addEventListener("pointerdown", onPointerDown);
    mapContainer.addEventListener("pointermove", onPointerMove);
    mapContainer.addEventListener("pointerup", onPointerUp);
    mapContainer.addEventListener("pointercancel", onPointerUp);

    // マウスホイールでズーム
    mapContainer.addEventListener("wheel", (event) => {
        event.preventDefault();
        changeZoom(event.deltaY < 0 ? 0.2 : -0.2);
    }, { passive: false });

    // 現在地の取得開始
    startLocationTracking();
}

// HTMLの読み込み完了後に初期化
document.addEventListener("DOMContentLoaded", initializeMap);
</script>

</body>
</html>
