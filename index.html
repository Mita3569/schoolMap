<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>School Map</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout">

        <div class="map-container" id="mapContainer">

            <div class="map-content" id="mapContent">
                <img src="./images/map.png" alt="マップ">

                <button class="marker"
                        type="button"
                        style="left: 40%; top: 30%;"
                        onclick="showInfo('図書館')">
                    ①
                </button>
            </div>

            <div class="zoom-controls">
                <button type="button" onclick="zoomIn()">＋</button>
                <button type="button" onclick="zoomOut()">－</button>
                <button type="button" onclick="resetZoom()">⟳</button>
            </div>

        </div>
        </main>

        <!-- 操作説明欄 -->
        <aside class="sidebar">
            <h2>操作説明</h2>
            <p>マップの操作方法を表示します。</p>
        </aside>

    </div>
<script>
let zoom = 1;

const mapContent = document.getElementById("mapContent");
const mapContainer = document.getElementById("mapContainer");

function updateZoom() {
    mapContent.style.transform = `scale(${zoom})`;
    console.log("現在の拡大率:", zoom);
}

function zoomIn() {
    zoom = Math.min(zoom + 0.25, 4);
    updateZoom();
}

function zoomOut() {
    zoom = Math.max(zoom - 0.25, 1);
    updateZoom();
}

function resetZoom() {
    zoom = 1;
    updateZoom();
}

mapContainer.addEventListener("wheel", function(event) {
    event.preventDefault();

    if (event.deltaY < 0) {
        zoomIn();
    } else {
        zoomOut();
    }
}, { passive: false });
</script>

</body>
</html>
